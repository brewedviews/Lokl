# Local-dev orchestration — single command brings up the whole stack.
# Usage:  docker compose --env-file .env up --build
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks: [lokl_net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-lokl_dev}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8001:8001"
    networks: [lokl_net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REACT_APP_BACKEND_URL: ${REACT_APP_BACKEND_URL:-http://localhost:8001}
        REACT_APP_SENTRY_DSN: ${REACT_APP_SENTRY_DSN:-}
        REACT_APP_SENTRY_ENVIRONMENT: ${REACT_APP_SENTRY_ENVIRONMENT:-development}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks: [lokl_net]

volumes:
  mongo_data:

networks:
  lokl_net:
