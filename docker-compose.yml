# Local-dev orchestration — single command brings up the whole stack.
# Usage:  docker compose --env-file .env up --build
services:
  mongo:
    image: mongo:7.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - "27017:27017"
    networks: [lokl_net]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URL: ${MONGO_URL:-mongodb://mongo:27017}
      DB_NAME: ${DB_NAME:-lokl_dev}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "8001:8001"
    networks: [lokl_net]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8001/api/heartbeat"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Lokl Next.js 15 frontend (Session E cutover — Feb 2026).
  # Legacy CRA app preserved in ./frontend-legacy/ with its own Dockerfile;
  # to roll back, swap `context: ./frontend` → `./frontend-legacy` and rebuild.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://backend:8001}
        NEXT_PUBLIC_STORAGE_HOST: ${NEXT_PUBLIC_STORAGE_HOST:-}
        NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-production}
        NEXT_PUBLIC_SENTRY_DSN: ${NEXT_PUBLIC_SENTRY_DSN:-}
        NEXT_PUBLIC_SENTRY_ENVIRONMENT: ${NEXT_PUBLIC_SENTRY_ENVIRONMENT:-development}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    networks: [lokl_net]
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/', r => process.exit(r.statusCode===200?0:1))"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  mongo_data:

networks:
  lokl_net:
