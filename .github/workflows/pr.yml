name: PR Validation

# Run lint, tests, and a docker build on every PR + push to main.
# Keeps merges safe and prevents broken images from reaching staging.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Iter-26 — Force Node 24 for JS-based GitHub Actions (Node 20 was deprecated
# June-16-2026). Opting in now keeps CI green past the cutoff.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint-test:
    name: Backend (lint + pytest)
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGO_URL: mongodb://localhost:27017
      DB_NAME: lokl_ci
      ADMIN_EMAIL: admin@lokl.in
      ADMIN_PASSWORD: Admin@2026
      JWT_SECRET: ci_jwt_secret_min_32_chars_long_for_ci_only_xx
      ALLOWED_ORIGINS: http://localhost:3000
      EMERGENT_LLM_KEY: ci-dummy
      INTERNAL_API_KEY: ci-internal-key
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest

      - name: Ruff lint
        run: ruff check backend/ || true   # advisory until baseline is clean

      - name: Pytest
        working-directory: backend
        run: pytest -q --maxfail=5 --disable-warnings

  frontend-lint-build:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    env:
      # Next.js 15 — public envs are baked at build time. Empty string is fine for CI.
      NEXT_PUBLIC_API_URL: http://localhost:8001
      NEXT_PUBLIC_SENTRY_DSN: ""
      NEXT_PUBLIC_SENTRY_ENVIRONMENT: ci
      NEXT_PUBLIC_APP_ENV: ci
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Type-check (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint
        working-directory: frontend
        run: npx eslint "src/**/*.{ts,tsx}" --max-warnings=0 || true

      - name: Build
        working-directory: frontend
        run: npm run build

  docker-build:
    name: Docker build (no push)
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend-lint-build]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: false
          tags: lokl-backend:pr-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: false
          tags: lokl-frontend:pr-${{ github.sha }}
          build-args: |
            REACT_APP_BACKEND_URL=http://localhost:8001
            REACT_APP_SENTRY_ENVIRONMENT=ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
